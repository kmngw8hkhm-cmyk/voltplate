<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>VoltPlate · My E-Bike</title>
<style>
  :root{--bg:#0b0e1a;--panel:#141a2e;--panel2:#1b2240;--line:#2a3358;--text:#eef0fb;--muted:#8e97c2;
    --accent:#00e09a;--accent2:#4da3ff;--warn:#ffb84d;--danger:#ff5c7a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--text);min-height:100vh;
    background:radial-gradient(700px 400px at 0% -10%,rgba(0,224,154,.14),transparent 60%),radial-gradient(600px 400px at 110% 0%,rgba(77,163,255,.12),transparent 60%),var(--bg)}
  .wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#04120c;font-size:19px}
  .top b{font-size:18px}.top small{display:block;color:var(--muted);font-size:12px}
  .banner{border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:14px;border:1px solid}
  .banner .ic{font-size:38px}
  .banner h1{margin:0;font-size:21px}.banner p{margin:3px 0 0;font-size:13px;opacity:.85}
  .banner.valid{background:rgba(0,224,154,.10);border-color:rgba(0,224,154,.45)}
  .banner.expiring{background:rgba(255,184,77,.10);border-color:rgba(255,184,77,.45)}
  .banner.expired,.banner.stolen,.banner.bad{background:rgba(255,92,122,.10);border-color:rgba(255,92,122,.45)}
  .banner.stolen{animation:pulse 1.3s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,92,122,.15)}}
  .plate{background:#fff;border-radius:14px;display:flex;overflow:hidden;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .plate .c{background:#0c1838;color:#fff;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:78px}
  .plate .c b{font-size:22px}.plate .c small{font-size:10px;color:#9fb3d9;margin-top:2px;text-align:center}
  .plate .n{flex:1;display:flex;align-items:center;justify-content:center;font-family:Consolas,"Courier New",monospace;font-weight:700;font-size:40px;color:#111;letter-spacing:2px;padding:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:9px 10px;font-size:15px}
  .kv span:nth-child(odd){color:var(--muted);font-size:13px;padding-top:2px}
  .progress{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden;margin:10px 0 6px}
  .progress i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .days{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .big{font-size:30px;font-weight:700}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .btn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;text-decoration:none}
  .btn span{font-size:22px}.btn small{font-weight:400;color:var(--muted);font-size:12px}
  .btn:active{transform:scale(.97)}
  .btn.red{border-color:rgba(255,92,122,.5)} .btn.red b{color:var(--danger)}
  .tips li{margin:6px 0;font-size:14px;color:#d5d9f0}
  .tips{padding-left:18px;margin:0}
  .seal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);justify-content:center;margin-top:6px}
  .seal.ok b{color:var(--accent)} .seal.no b{color:var(--danger)}
  .foot{text-align:center;color:#5c6699;font-size:11px;margin-top:18px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
  /* full screen plate */
  #full{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:50;padding:16px}
  #full.on{display:flex}
  .screen{width:100%;max-width:820px;aspect-ratio:2.6/1;border-radius:20px;background:#05070d;border:3px solid #1d2335;box-shadow:0 0 0 8px #0b0f1a,0 0 70px rgba(0,224,154,.3);display:flex;align-items:center;justify-content:center;gap:4%;position:relative;overflow:hidden}
  .screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px)}
  .screen .ci{writing-mode:vertical-rl;transform:rotate(180deg);color:#00e09a;font-weight:800;font-size:clamp(14px,4vw,32px);letter-spacing:3px}
  .screen .nu{font-family:Consolas,monospace;font-weight:700;font-size:clamp(38px,13vw,115px);color:#e8fff6;text-shadow:0 0 18px rgba(0,224,154,.85);white-space:nowrap}
  .screen.stolen{box-shadow:0 0 0 8px #0b0f1a,0 0 80px rgba(255,60,90,.6)}
  .screen.stolen .nu{text-shadow:0 0 18px rgba(255,60,90,.95);animation:pulse2 1s infinite} .screen.stolen .ci{color:#ff3c5a}
  @keyframes pulse2{50%{opacity:.35}}
  .hint{color:#666;font-size:13px;text-align:center}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:60}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="full" onclick="closeFull()">
  <div class="screen" id="scr"><div class="ci" id="fCi"></div><div class="nu" id="fNu"></div></div>
  <div class="hint">Turn your phone sideways for a bigger plate · tap to close</div>
</div>
<div id="toast"></div>

<script>
// ===================== CONFIG — edit before hosting =====================
const REGISTRY_NAME     = 'VoltPlate E-Bike Registry';
const REGISTRY_WHATSAPP = '';            // e.g. '971501234567' (no + or spaces). Empty = use email
const REGISTRY_EMAIL    = 'support@example.com';
const SEAL_KEY          = 'voltplate-demo-2026';   // must match SEAL_KEY in index.html
// =======================================================================

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CITIES={DXB:'Dubai',AUH:'Abu Dhabi',SHJ:'Sharjah',AJM:'Ajman',RAK:'Ras Al Khaimah',FUJ:'Fujairah',UAQ:'Umm Al Quwain'};
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600); }
function seal(str){ let h=2166136261; for(const ch of str+SEAL_KEY){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }
function decode(s){ try{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  const f=decodeURIComponent(escape(atob(s))).split('|'); if(f.length<14) return null;
  const dt=x=>x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6,8);
  return {p:f[0],id:f[1],n:f[2],c:f[3],b:f[4],m:f[5],t:f[6],co:f[7],w:f[8],sp:f[9],se:f[10],i:dt(f[11]),e:dt(f[12]),s:f[13]==='1'};
}catch(e){ return null; } }

let D=null, ST='';
function statusOf(d){ if(d.s) return 'stolen'; const days=(new Date(d.e+'T23:59:59')-new Date())/864e5; return days<0?'expired':days<=30?'expiring':'valid'; }

function render(){
  const params=new URLSearchParams(location.hash.slice(1));
  const raw=params.get('d'), sig=params.get('k');
  D=raw?decode(raw):null;
  if(!D){ renderEmpty(raw?'This QR code could not be read.':''); return; }
  const sealed = sig===seal(raw);
  ST=statusOf(D);
  const info={
    valid:['✅','Registered & valid','This e-bike is registered and allowed on the road.'],
    expiring:['⚠️','Expiring soon','Registration ends in a few days — please renew.'],
    expired:['⛔','Registration expired','This e-bike must be renewed before riding.'],
    stolen:['🚨','Reported stolen','Do not buy this e-bike. Please contact the registry.']}[ST];
  const issued=new Date(D.i+'T00:00:00'), exp=new Date(D.e+'T23:59:59');
  const total=Math.max(1,exp-issued), used=Math.min(total,Math.max(0,Date.now()-issued));
  const left=Math.ceil((exp-Date.now())/864e5);
  const pn=D.p.split(' ');
  $('app').innerHTML=`
  <div class="top"><div class="mark">⚡</div><div><b>VoltPlate</b><small>${esc(REGISTRY_NAME)}</small></div></div>
  <div class="banner ${sealed?ST:'bad'}"><div class="ic">${sealed?info[0]:'❌'}</div><div>
    <h1>${sealed?info[1]:'Not verified'}</h1><p>${sealed?info[2]:'This code was changed or is fake. Do not trust these details.'}</p></div></div>
  <div class="plate"><div class="c"><b>${esc(D.c)}</b><small>${esc((CITIES[D.c]||'').toUpperCase())}</small></div><div class="n">${esc(pn[1])} ${esc(pn[2])}</div></div>
  <div class="card"><h2>Registration</h2>
    <div class="days"><span>Days left</span><span>${fmt(D.i)} → ${fmt(D.e)}</span></div>
    <div class="big" style="color:${left<0?'var(--danger)':left<=30?'var(--warn)':'var(--accent)'}">${left<0?'Expired '+(-left)+' days ago':left+' days'}</div>
    <div class="progress"><i style="width:${used/total*100}%"></i></div>
  </div>
  <div class="card"><h2>Vehicle</h2><div class="kv">
    <span>Owner</span><span>${esc(D.n)}</span>
    <span>Vehicle</span><span>${esc(D.b)} ${esc(D.m)}</span>
    <span>Type · colour</span><span>${esc(D.t)} · ${esc(D.co)}</span>
    <span>Motor</span><span>${esc(D.w)} W · max ${esc(D.sp)} km/h</span>
    <span>Serial</span><span>${esc(D.se)}</span>
    <span>City</span><span>${esc(CITIES[D.c]||D.c)}</span>
  </div></div>
  <div class="btns">
    <button class="btn" onclick="openFull()"><span>📺</span>Show plate<small>Full-screen digital plate</small></button>
    <button class="btn" onclick="reminder()"><span>⏰</span>Renewal reminder<small>Add to your calendar</small></button>
    <button class="btn" onclick="share()"><span>📤</span>Share<small>Send this check to someone</small></button>
    <button class="btn red" onclick="reportStolen()"><span>🚨</span><b>${ST==='stolen'?'Contact registry':'Report stolen'}</b><small>Message the registry</small></button>
  </div>
  <div class="card"><h2>Ride safe</h2><ul class="tips">
    <li>🪖 Always wear a helmet and bright clothing.</li>
    <li>🚦 Use cycle lanes where available and follow traffic signals.</li>
    <li>💡 Keep front and rear lights on at night.</li>
    <li>🐢 Stay within your e-bike's speed limit (${esc(D.sp)} km/h).</li>
    <li>🔒 Lock your e-bike — and report it at once if stolen.</li>
  </ul></div>
  <div class="seal ${sealed?'ok':'no'}">${sealed?'🔐 <b>Digital seal OK</b>':'⚠ <b>Seal check failed</b>'} · Plate ID ${esc(D.id||'').toUpperCase()}</div>
  <div class="seal">Details are as recorded when this QR was issued.</div>
  <div class="foot">School demo project · not an official government service</div>`;
}

function renderEmpty(msg){
  $('app').innerHTML=`
  <div class="top"><div class="mark">⚡</div><div><b>VoltPlate</b><small>${esc(REGISTRY_NAME)}</small></div></div>
  ${msg?`<div class="banner bad"><div class="ic">❌</div><div><h1>Invalid code</h1><p>${esc(msg)}</p></div></div>`:''}
  <div class="card" style="text-align:center;padding:30px 18px"><div style="font-size:54px">📷</div>
    <h2 style="text-transform:none;font-size:18px;color:var(--text);letter-spacing:0">Scan a VoltPlate QR code</h2>
    <p style="color:var(--muted);font-size:14px">Point your phone camera at the QR code on an e-bike's digital or printed plate. This page will open with the bike's registration status.</p></div>
  <div class="card"><h2>Have a link?</h2><input id="paste" placeholder="Paste the plate link here"><br><br>
    <button class="btn" style="width:100%;align-items:center" onclick="openPasted()">Check</button></div>
  <div class="foot">School demo project · not an official government service</div>`;
}
function openPasted(){ const v=$('paste').value.trim(); const i=v.indexOf('#'); if(i<0){ toast('That link has no plate data'); return; } location.hash=v.slice(i+1); }

function openFull(){ const p=D.p.split(' '); $('fCi').textContent=D.c; $('fNu').textContent=p[1]+' '+p[2]; $('scr').className='screen'+(ST==='stolen'?' stolen':''); $('full').classList.add('on');
  try{ document.documentElement.requestFullscreen?.().catch(()=>{}); screen.orientation?.lock?.('landscape').catch(()=>{}); }catch(e){} }
function closeFull(){ $('full').classList.remove('on'); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }

function reminder(){
  const exp=new Date(D.e+'T09:00:00'); const r=new Date(exp); r.setDate(r.getDate()-14);
  const f=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VoltPlate//EN','BEGIN:VEVENT','UID:'+D.id+'@voltplate','DTSTAMP:'+f(new Date()),
    'DTSTART:'+f(r),'DTEND:'+f(new Date(r.getTime()+36e5)),'SUMMARY:Renew e-bike plate '+D.p,
    'DESCRIPTION:Your VoltPlate registration for '+D.b+' '+D.m+' expires on '+fmt(D.e)+'.',
    'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:Renew e-bike plate','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download='renew-'+D.p.replace(/\s/g,'-')+'.ics'; a.click();
  toast('⏰ Reminder set for '+r.toLocaleDateString('en-GB'));
}
async function share(){
  const data={title:'E-bike plate '+D.p,text:'Check the registration of e-bike '+D.p,url:location.href};
  try{ if(navigator.share){ await navigator.share(data); return; } await navigator.clipboard.writeText(location.href); toast('🔗 Link copied'); }catch(e){}
}
function reportStolen(){
  const msg=`Hello ${REGISTRY_NAME}, I want to report that the e-bike with plate ${D.p} (${D.b} ${D.m}, serial ${D.se}) is stolen. Plate ID: ${D.id}.`;
  const url = REGISTRY_WHATSAPP ? `https://wa.me/${REGISTRY_WHATSAPP}?text=${encodeURIComponent(msg)}`
    : `mailto:${REGISTRY_EMAIL}?subject=${encodeURIComponent('Stolen e-bike '+D.p)}&body=${encodeURIComponent(msg)}`;
  location.href=url;
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
